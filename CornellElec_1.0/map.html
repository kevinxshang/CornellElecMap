<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="X-UA-Compatible" content="ie=edge" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
	<script src='https://www.unpkg.com/suncalc@1.9.0/suncalc.js'></script>
	<script src="https://unpkg.com/osmtogeojson/osmtogeojson.js"></script>
	<script src="leaflet-shadow-simulator.umd.min.js"></script>
	<style>
		body {
			padding: 0px;
			margin: 0px;
		}

		#mapid {
			height: 100vh;
		}

		.leaflet-control-time.leaflet-control {
			padding: 20px;
			background-color: white;
		}

		#exposure-gradient-container {
			display: none;
			background-color: white;
			padding: 0 10px 5px;
			margin-top: 0;
			float: none;
		}

		#exposure-gradient {
			height: 20px;
			background-image: linear-gradient(to right, rgb(0 0 255 / 0.5), rgb(0 255 0 / 0.5), rgb(255 0 0 / 0.5));
			display: flex;
		}

		#exposure-gradient>div {
			flex: 1;
			border: 1px solid white;
			text-align: center;
			font-weight: bold;
		}

		#timeSlider {
			position: absolute;
			top: 10px;
			left: 10px;
			z-index: 1000.
		}
	</style>
	<title>Shade Map Leaflet example</title>
</head>

<body>
	<div id="mapid"></div>
	<div class="leaflet-control-container">
		<div class="leaflet-top leaflet-left">
			<div class="leaflet-control-time leaflet-control">
				<button id="decrement">-1 hour</button>
				<button id="increment">+1 hour</button>
				<button id="play">Play</button>
				<button id="stop">Stop</button>
				<label><input id="exposure" type="checkbox" autocomplete="off" />Full-day sun exposure</label>
				<button>
					<a href="https://shademap.app/about" target="_blank">Get API key</a>
				</button>
				<span id="loader" style="padding: 3px;"></span>
			</div>
			<div class="leaflet-control-time leaflet-control" id="exposure-gradient-container">
				<div>Hours of sunlight</div>
				<div id="exposure-gradient"></div>
			</div>
		</div>
		<input type="range" id="timeSlider" min="0" max="11" value="0">
	</div>
	<script>
		const levelColors = [
			'#083a7a', // January
			'#08306b', // February
			'#08468c', // March
			'#f7fbff', // April
			'#1967ad', // May
			'#084b94', // June
			'#0c56a0', // July
			'#08519c', // August
			'#08509a', // September
			'#0f5ba3', // October
			'#084e97', // November
			'#083877'  // December
		];

		/* Leaflet setup */
		var map = L.map("mapid", { zoomControl: false }).setView([42.4534, -76.4735], 15);
		L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
			attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
			maxZoom: 18,
		}).addTo(map);

		L.control.zoom({
			position: 'bottomright'
		}).addTo(map);
		/* End Leaflet setup */


		/* ShadeMap setup */
		const loaderEl = document.getElementById('loader');
		let now = new Date(1633358583454);
		const shadeMap = L.shadeMap({
			apiKey: "eyJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6InRwcGlvdHJvd3NraUBzaGFkZW1hcC5hcHAiLCJjcmVhdGVkIjoxNjYyNDkzMDY2Nzk0LCJpYXQiOjE2NjI0OTMwNjZ9.ovCrLTYsdKFTF6TW3DuODxCaAtGQ3qhcmqj3DWcol5g",
			date: now,
			color: '#01112f',
			opacity: 0.7,
			terrainSource: {
				maxZoom: 15,
				tileSize: 256,
				getSourceUrl: ({ x, y, z }) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`,
				getElevation: ({ r, g, b, a }) => (r * 256 + g + b / 256) - 32768,
				_overzoom: 18,
			},
			getFeatures: async () => {
				try {
					if (map.getZoom() > 15) {
						const bounds = map.getBounds();
						const north = bounds.getNorth();
						const south = bounds.getSouth();
						const east = bounds.getEast();
						const west = bounds.getWest();
						const query = `https://overpass-api.de/api/interpreter?data=%2F*%0AThis%20has%20been%20generated%20by%20the%20overpass-turbo%20wizard.%0AThe%20original%20search%20was%3A%0A%E2%80%9Cbuilding%E2%80%9D%0A*%2F%0A%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3B%0A%2F%2F%20gather%20results%0A%28%0A%20%20%2F%2F%20query%20part%20for%3A%20%E2%80%9Cbuilding%E2%80%9D%0A%20%20way%5B%22building%22%5D%28${south}%2C${west}%2C${north}%2C${east}%29%3B%0A%29%3B%0A%2F%2F%20print%20results%0Aout%20body%3B%0A%3E%3B%0Aout%20skel%20qt%3B`;
						const response = await fetch(query)
						const json = await response.json();
						const geojson = osmtogeojson(json);
						// If no building height, default to one storey of 3 meters
						geojson.features.forEach(feature => {
							if (!feature.properties) {
								feature.properties = {};
							}
							if (!feature.properties.height) {
								feature.properties.height = 3;
							}
						});
						return geojson.features;
					}
				} catch (e) {
					console.error(e);
				}
				return [];
			},
			debug: (msg) => { console.log(new Date().toISOString(), msg) }
		}).addTo(map);

		shadeMap.on('tileloaded', (loadedTiles, totalTiles) => {
			loaderEl.innerText = `Loading: ${(loadedTiles / totalTiles * 100).toFixed(0)}%`;
		});
		/* End ShadeMap setup */

		/* Additional layer setup */
		async function addCornellBuildingsLayer() {
			try {
				const response = await fetch('cugir-008163-geojson_copy.json'); // Relative path from the server root
				if (!response.ok) {
					throw new Error('Network response was not ok');
				}
				const data = await response.json();
				console.log('GeoJSON data:', data); // Add this line to check GeoJSON data

				const buildingNames = [
					"BAILEY HALL", "BARTON HALL- CU POLICE", "BEEBE HALL", "PLANTATIONS HORTICULTURAL CTR",
					"BOYCE THOMPSON INSTITUTE", "BOYCE THOMPSON INSTITUTE", "BRADFIELD HALL", "BRUCKNER LAB",
					"CALDWELL HALL", "CALS SURGE FACILITY", "CLINICAL PROGRAMS - L BARN", "CLINICAL PROGRAMS - SURGERY",
					"COMPUTING & COMMUNICATIONS CTR", "COMSTOCK HALL-ACADEMIC II", "DIMOCK,A W ENVR CONTROL LAB",
					"EAST CAMPUS RESEARCH FACILITY", "EMERSON HALL", "FERNOW HALL", "TOWER RD EAST GREEN GH 1045G",
					"GUTERMAN BIOCLIMATIC LAB", "HUMAN ECOLOGY BUILDING", "DYCE LABORATORY", "IVES HALL", "IVES HALL EAST",
					"IVES HALL FACULTY WING", "IVES HALL WEST", "KENNEDY HALL", "KENNETH POST LAB", "LARGE ANIMAL ISOLATION",
					"LRG ANIMAL RES. TEACHING UNIT", "LIVESTOCK PAVILION", "LOVE LAB - PLANT BREEDING", "MANN LIBRARY",
					"MANN LIBRARY ADDITION", "MARTHA VAN RENSSELAER WEST", "MARTHA VAN RENSSELAER HALL", "MARTHA VAN RENSSELAER WEST",
					"MORRISON HALL", "MUENSCHER LABORATORY", "PLANT SCIENCE BUILDING", "PLANT VIROLOGY-NEMATOLOGY",
					"TOWER RD EAST PURPLE CNS 1023A", "RICE HALL", "RILEY-ROBB HALL", "SAVAGE HALL", "SCHURMAN HALL",
					"STOCKING HALL", "STOCKING HALL ADDITION", "NYS VETERINARY DIAGNOSTIC LAB", "VET EDUCATION CENTER",
					"CAYUGA MEDICAL CENTER", "VET RESEARCH TOWER", "VET RESEARCH TOWER", "WARREN HALL", "WASTE MANAGEMENT FACILITY",
					"WING HALL", "WING HALL WING", "MAPLE AVE 120", "BAKER LABORATORY", "BARD HALL", "BIG RED BARN BBQ",
					"BIOTECHNOLOGY", "BIOTECHNOLOGY", "CARPENTER HALL", "CHILL WATER PLANT 1-WEINHOLD", "CHILL WATER-PLANT 3",
					"CHILL WATER PLANT 2-STATE", "CLARK HALL", "DALE R CORSON BIO SCIENCE WING", "DAY HALL", "DUFFIELD HALL",
					"EAST HILL PLAZA", "ENVIRONMENTAL HEALTH & SAFETY", "FS CARPENTER & PAINT SHOPS", "FM SHOPS ANNEX",
					"FOUNDRY", "BILL AND MELINDA GATES HALL", "GOLDWIN SMITH HALL", "GROUNDS OPERATIONS FACILITY",
					"GRUMMAN HALL", "HOLLISTER HALL", "HOLLISTER HALL", "HUMPHREYS SERVICE BLDG", "JOHNSON MUSEUM OF ART",
					"KIMBALL HALL", "KITE HILL SUB STATION", "KLARMAN HALL", "KROCH,CARL A LIBRARY", "LIBRARY ANNEX-STORAGE FACILITY",
					"LINCOLN HALL", "MALOTT HALL", "MAPLE AVE PIPE/WELDING SHOP", "MCGRAW HALL", "MILSTEIN HALL",
					"MORRILL HALL", "MYRON TAYLOR HALL", "NEWMAN, FLOYD R. LABORATORY", "OLIN CHEMISTRY RESEARCH WING",
					"OLIN HALL", "OLIN LIBRARY", "PARKING GARAGE", "PHILLIPS HALL", "PHYSICAL SCIENCES BUILDING",
					"PLEASANT GROVE ROAD PRV STATION", "RAND HALL", "FRANK H T RHODES HALL", "ROCKEFELLER HALL",
					"SAGE HALL", "SCHWARTZ CTR-PERFORMING ARTS", "SIBLEY HALL", "SNEE HALL GEOLOGICAL SCIENCE",
					"SPACE SCIENCES BUILDING - CRSR", "STATLER HALL & AUDITORIUM", "STATLER HOTEL", "STIMSON HALL",
					"TENNIS BUILDING - CASCADILLA G", "OLIVE TJADEN HALL", "UPSON HALL", "URIS HALL", "URIS LIBRARY",
					"WARD CENTER FOR NUCLEAR STDIES", "WATER TREATMENT PLANT ENDOWED", "WEILL HALL", "WHITE HALL", "WILSON LAB",
					"CENTRAL HEATING PLANT", "ILR CONFERENCE CENTER", "NORTH CAMPUS TOWNHOUSE C", "ROBERT W HOLLEY CTR AG&HEALTH",
					"APPEL COMMONS", "BALCH HALL", "BARNES HALL", "BARTELS HALL", "THE CORNELL STORE", "CASCADILLA HALL",
					"CLARA DICKSON HALL", "COURT HALL", "DELTA TAU DELTA", "FRIEDMAN STRENGTH & CONDTN CTR",
					"FRIEDMAN WRESTLING CENTER", "GANNETT HEALTH SERVICES", "GRUMMAN SQUASH COURTS", "HELEN NEWMAN HALL",
					"HURLBURT HOUSE", "KAY HALL", "LYNAH RINK", "LYON HALL", "MARY DONLON HALL", "MCFADDIN HALL",
					"MEWS HALL", "NORTH CAMPUS RESIDENTIAL EXPANSION", "NORTH CAMPUS RESIDENTIAL EXPANSION", "NORTH CAMPUS",
					"HIGH RISE 5", "LOW RISE 6", "LOW RISE 7", "LOW RISE 9", "NOYES COMMUNITY AND REC CENTER", "NOYES LODGE",
					"PHI KAPPA PSI", "PSI UPSILON", "RISLEY HALL", "ROBERT PURCELL COMMUNITY CTR", "ROBERT PURCELL COMMUNITY CTR STEAM TURBINE",
					"RUTH BADER GINSBURG HALL", "SAGE CHAPEL", "SCHOELLKOPF CRESCENT", "SCHOELLKOPF FIELD", "SCHOELLKOPF HALL",
					"SIGMA PHI", "TEAGLE HALL", "THURSTON COURT APTS", "TONI MORRISON HALL", "UJAMAA RESIDENTIAL COLLEGE",
					"WEST CAMPUS", "WILLARD STRAIGHT HALL", "WILLIAM KEETON HOUSE"
				];

				const geoJsonLayer = L.geoJSON(data, {
					style: function (feature) {
						return {
							color: buildingNames.includes(feature.properties.buildingna) ? getRandomTransitionColor() : '#CCCCCC',
							fillOpacity: 0.75
						};
					}
				}).addTo(map);

				let intervalTimer;

				document.getElementById('play').addEventListener('click', function () {
					intervalTimer = setInterval(function () {
						geoJsonLayer.setStyle(function (feature) {
							return {
								color: buildingNames.includes(feature.properties.buildingna) ? getRandomTransitionColor() : '#CCCCCC',
								fillOpacity: 0.75
							};
						});
					}, 1500); // Update every 1.5 seconds
				});

				document.getElementById('stop').addEventListener('click', function () {
					clearInterval(intervalTimer);
				});

			} catch (error) {
				console.error('Error processing GeoJSON data:', error);
			}
		}

		// Function to interpolate between two colors
		function interpolateColor(color1, color2, factor) {
			if (arguments.length < 3) {
				factor = 0.5;
			}
			const result = color1.slice();
			for (let i = 0; i < 3; i++) {
				result[i] = Math.round(result[i] + factor * (color2[i] - result[i]));
			}
			return result;
		}

		// Convert hex color to RGB array
		function hexToRgb(hex) {
			const bigint = parseInt(hex.slice(1), 16);
			return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
		}

		// Convert RGB array to hex color
		function rgbToHex(rgb) {
			return '#' + rgb.map(x => {
				const hex = x.toString(16);
				return hex.length === 1 ? '0' + hex : hex;
			}).join('');
		}

		// Function to get a random transition color between #F7F9D9 and #A9B406
		function getRandomTransitionColor() {
			const color1 = hexToRgb('#F7F9D9');
			const color2 = hexToRgb('#A9B406');
			const factor = Math.random();
			const result = interpolateColor(color1, color2, factor);
			return rgbToHex(result);
		}

		addCornellBuildingsLayer();



		/* End additional layer setup */

		/* Controls setup */
		let intervalTimer;
		const increment = document.getElementById('increment');
		const decrement = document.getElementById('decrement');
		const play = document.getElementById('play');
		const stop = document.getElementById('stop');
		const exposure = document.getElementById('exposure');
		const exposureGradientContainer = document.getElementById('exposure-gradient-container');
		const exposureGradient = document.getElementById('exposure-gradient');

		increment.addEventListener('click', () => {
			now = new Date(now.getTime() + 3600000);
			shadeMap.setDate(now);
		}, false);

		decrement.addEventListener('click', () => {
			now = new Date(now.getTime() - 3600000);
			shadeMap.setDate(now);
		}, false);

		play.addEventListener('click', () => {
			intervalTimer = setInterval(() => {
				now = new Date(now.getTime() + 60000);
				shadeMap.setDate(now);
			}, 100);
		});

		stop.addEventListener('click', () => {
			clearInterval(intervalTimer);
		})

		exposure.addEventListener('click', (e) => {
			clearInterval(intervalTimer);
			const target = e.target;
			if (!target.checked) {
				shadeMap && shadeMap.setSunExposure(false);
				increment.disabled = false;
				decrement.disabled = false;
				play.disabled = false;
				stop.disabled = false;
				exposureGradientContainer.style.display = 'none';
			} else {
				const { lat, lng } = map.getCenter();
				const { sunrise, sunset } = SunCalc.getTimes(now, lat, lng);
				shadeMap && shadeMap.setSunExposure(true, {
					startDate: sunrise,
					endDate: sunset
				});
				increment.disabled = true
				decrement.disabled = true;
				play.disabled = true;
				stop.disabled = true;

				const hours = (sunset - sunrise) / 1000 / 3600;
				const partial = hours - Math.floor(hours);
				const html = [];
				for (let i = 0; i < hours; i++) {
					html.push(`<div>${i + 1}</div>`)
				}
				html.push(`<div style="flex: ${partial}"></div>`);
				exposureGradientContainer.style.display = 'block';
				exposureGradient.innerHTML = html.join('');
			}
		})
		/* End controls setup */

	</script>
</body>

</html>
